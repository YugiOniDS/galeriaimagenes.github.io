<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de imagenes</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">
    <!-- BARRA LATERAL IZQUIERDA (Drawer) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-contenido">
        <p class="sidebar-titulo">Categorias de imagenes</p>
        
        <ul class="menu-categorias">
          <li>
            <button type="button" onclick="mostrarCarrusel('videojuegos')" class="btn-dash btn-default">
              <span class="texto-boton">Videojuegos</span>
            </button>
          </li>
          <li>
            <button type="button" onclick="mostrarCarrusel('artistas')" class="btn-dash btn-primary">
              <span class="texto-boton">Artistas</span>
            </button>
          </li>
          <li>
            <button type="button" onclick="mostrarCarrusel('animales')" class="btn-dash btn-secondary">
              <span class="texto-boton">Animales</span>
            </button>
          </li>
          <li>
            <button type="button" onclick="mostrarCarrusel('comida')" class="btn-dash btn-accent">
              <span class="texto-boton">Comida</span>
            </button>
          </li>
          <li>
            <button type="button" onclick="mostrarCarrusel('animes')" class="btn-dash btn-info">
              <span class="texto-boton">Animes</span>
            </button>
          </li>
        </ul>
      </div>
    </aside>

    <!-- CONTENIDO DERECHO -->
    <div class="contenido-principal">
      <!-- Barra superior (Navbar) -->
      <nav class="navbar">
        <button type="button" onclick="alternarMenu()" aria-label="abrir barra lateral" class="btn-toggle">
          <svg xmlns="http://w3.org" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" width="18" height="18">
            <path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path>
            <path d="M9 4v16"></path>
            <path d="M14 10l2 2l-2 2"></path>
          </svg>
        </button>
        <div class="navbar-buscador">
          <input type="text" id="input-busqueda" placeholder="Buscar categoría..." onkeyup="filtrarCategorias()" class="input-buscar">
        </div>
      </nav>

      <!-- Zona centrada donde aparecen los carruseles -->
      <main class="zona-carruseles">

        <!-- 1. CARRUSEL VIDEOJUEGOS (7 imágenes exactas) -->
        <div id="carrusel-videojuegos" class="galeria-carrusel">
          <h2 class="titulo-carrusel">Videojuegos</h2>
          <div class="carousel">
            <div class="carousel-item">
              <img src="public/imagenes/juego1.webp" alt="Sonic CD" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/juego2.jpg" alt="Sonic Adventure 2" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/juego3.jpg" alt="Silent Hill 2" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/juego4.jpg" alt="Left 4 Dead 2" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/Juego5.jpg" alt="Charlie Murder" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/juego6.jpg" alt="Cuphead" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/juego7.jpg" alt="ENA Dream BBQ" />
            </div>
          </div>
        </div>

        <!-- 2. CARRUSEL ARTISTAS (6 imágenes exactas) -->
        <div id="carrusel-artistas" class="galeria-carrusel oculto">
          <h2 class="titulo-carrusel">Artistas</h2>
          <div class="carousel">
            <div class="carousel-item">
              <img src="public/imagenes/artista1.jpg" alt="Zoé" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/artista2.jpg" alt="Nirvana" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/artista3.jpg" alt="Megadeth" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/artista4.jpg" alt="Gorillaz" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/artista5.jpg" alt="Enjambre" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/artista6.webp" alt="Artista 6" />
            </div>
          </div>
        </div>

        <!-- 3. CARRUSEL ANIMALES (6 imágenes exactas) -->
        <div id="carrusel-animales" class="galeria-carrusel oculto">
          <h2 class="titulo-carrusel">Animales</h2>
          <div class="carousel">
            <div class="carousel-item">
              <img src="public/imagenes/animal1.jpg" alt="Capibara" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/animal2.jpg" alt="Ardilla" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/animal3.jpg" alt="Ajolote" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/animal4.jpg" alt="Gatito" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/animal5.jpg" alt="Perro" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/animal6.jpg" alt="Perrito blanco" />
            </div>
          </div>
        </div>

        <!-- 4. CARRUSEL COMIDA (5 imágenes: 1, 2, 3, 4 y 6) -->
        <div id="carrusel-comida" class="galeria-carrusel oculto">
          <h2 class="titulo-carrusel">Comida</h2>
          <div class="carousel">
            <div class="carousel-item">
              <img src="public/imagenes/comida1.jpg" alt="Hot dogs" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/comida2.jpg" alt="Pizza" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/comida3.jpg" alt="Hot cakes" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/comida4.jpg" alt="Espagueti" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/comida6.jpg" alt="Helado" />
            </div>
          </div>
        </div>

        <!-- 5. CARRUSEL ANIMES (5 imágenes exactas, con anime3.png) -->
        <div id="carrusel-animes" class="galeria-carrusel oculto">
          <h2 class="titulo-carrusel">Animes</h2>
          <div class="carousel">
            <div class="carousel-item">
              <img src="public/imagenes/anime1.jpg" alt="One Piece" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/anime2.jpg" alt="JoJo's Bizarre Adventure" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/anime3.png" alt="Dragon Ball Z" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/anime4.jpg" alt="Yu-Gi-Oh!" />
            </div>
            <div class="carousel-item">
              <img src="public/imagenes/anime5.jpg" alt="Hunter x Hunter" />
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
